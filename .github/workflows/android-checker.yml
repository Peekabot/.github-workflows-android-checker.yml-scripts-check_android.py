name: Check X Chat Android Launch

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  check-android-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Run Android launch checker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/check_android.py

      - name: Commit detection state
        if: always()
        run: |
          echo "$(date -u): checked" >> history.log
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add history.log last_alert_hash.txt detections.json 2>/dev/null || true
          git commit -m "Update detection state [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
