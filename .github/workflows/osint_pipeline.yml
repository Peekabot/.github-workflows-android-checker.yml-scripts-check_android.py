name: Capital Region OSINT Pipeline

on:
  schedule:
    - cron: '0 7,13,19 * * *'   # 7am, 1pm, 7pm UTC (3am, 9am, 3pm ET)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers playwright install chromium --with-deps 2>/dev/null || true

      - name: Run OSINT pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cd scripts
          python run_pipeline.py

      - name: Persist database
        if: always()
        run: |
          git config user.name  'github-actions'
          git config user.email 'actions@github.com'
          git add data/osint.db 2>/dev/null || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git commit -m "Update OSINT database [skip ci]" || echo "No changes"
          git push || echo "Push skipped"
