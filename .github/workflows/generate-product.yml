name: AI Prompt Factory - Weekly Product Drop

on:
  schedule:
    # Runs every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  generate-and-sell:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests beautifulsoup4

      - name: Find trending topic
        id: trend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          NICHE: ${{ vars.NICHE }}
        run: |
          TREND=$(python scripts/find_trend.py)
          echo "trend=$TREND" >> $GITHUB_OUTPUT
          echo "Found trend: $TREND"

      - name: Generate prompt pack
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NICHE: ${{ vars.NICHE }}
        run: |
          python scripts/generate_prompts.py "${{ steps.trend.outputs.trend }}"

      - name: Deploy to Gumroad
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          python scripts/deploy_to_gumroad.py "${{ steps.trend.outputs.trend }}"

      - name: Commit product record
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add products/
          git commit -m "Add new product: ${{ steps.trend.outputs.trend }} [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"

      - name: Send Telegram notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          topic = "${{ steps.trend.outputs.trend }}"
          if token and chat_id:
              msg = f"🚀 <b>New prompt pack deployed!</b>\n\nTopic: <code>{topic}</code>\n\nCheck your Gumroad dashboard for the new listing."
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": msg, "parse_mode": "HTML"},
                  timeout=10,
              )
          EOF
